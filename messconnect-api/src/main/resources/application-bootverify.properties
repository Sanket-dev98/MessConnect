# TEMPORARY verification profile (PART 3) — lets the API boot WITHOUT the real
# Supabase DB or real Firebase service account, so we can confirm the Spring
# context (FirebaseConfig, FirebaseAuthFilter, CurrentUserArgumentResolver,
# AuthController) loads cleanly.
#
# Activate with: -Dspring.profiles.active=bootverify
# DELETE this file once SUPABASE_DB_URL + the real service-account JSON exist.

spring.datasource.url=jdbc:h2:mem:messconnect;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false

# Keep the Firebase service-account path pointing at the (stub) classpath JSON.
firebase.service-account.path=classpath:firebase-service-account.json
