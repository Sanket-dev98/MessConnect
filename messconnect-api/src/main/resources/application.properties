spring.application.name=messconnect-api

server.port=8080

# Default profile: bootverify uses H2 in-memory DB + stub Firebase
# To use real Supabase + Firebase, run with: -Dspring.profiles.active=default
spring.data.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false

# Part 3 boot-verify profile defaults (uses H2 in-memory DB, stub Firebase)
# To switch to default Supabase/Firebase profile, run with: -Dspring.profiles.active=default

# =====================================================================
# Supabase Postgres (cloud)
# The pooled connection string is supplied via the SUPABASE_DB_URL env var
# (e.g. postgresql://postgres.[project]:[password]@[host]:6543/postgres).
# Nothing secret is committed to this file.
# =====================================================================
spring.datasource.url=${SUPABASE_DB_URL:jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.flyway.placeholders.uuid_gen=gen_random_uuid()
spring.datasource.driver-class-name=${SUPABASE_DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL:update}
spring.jpa.open-in-view=false

# Flyway applies V1__create_schema.sql on startup (if the DB is empty).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Firebase Admin SDK (PART 3): path to the shared service-account JSON.
# This is the SAME Firebase project Flutter Auth uses (Prompt.txt rule #3).
firebase.service-account.path=classpath:firebase-service-account.json
